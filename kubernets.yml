apiVersion: apps/v1
kind: Deployment
metadata:
  name: amazon-deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: amazon
  template:
    metadata:
      labels:
        app: amazon
    spec:
      containers:
        - name: amazon-app
          image: armcool004/amazon:may
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: service-amazon
spec:
  type: NodePort
  selector:
    app: amazon
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 32767
