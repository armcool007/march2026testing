apiVersion: apps/v1
kind: Deployment
metadata:
  name: star-pod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: tiger
  template:
    metadata:
      labels:
        app: tiger
    spec:
      containers:
        - name: starbuks-app
          image: armcool004/starbuks:revision
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: star-svc
spec:
  type: NodePort
  selector:
    app: tiger
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30785
  
