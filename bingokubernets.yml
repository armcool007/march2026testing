apiVersion: apps/v1
kind: Deployment
metadata:
  name: bingo-deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: bingo
  template:
    metadata:
      labels:
        app: bingo
    spec:
      containers:
        - name: bingo-app
          image: armcool004/bingo:may
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: bingo-svc
spec:
  type: LoadBalancer
  selector:
    app: bingo
  ports:
    - port: 80
      targetPort: 3000
