apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotstar-pod
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hotstar-app
  template:
    metadata:
      labels:
        app: hotstar-app
    spec:
      containers:
        - name: hotstar-container
          image: armcool004/hotstar:revision
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: hotstar-svc
spec:
  type: NodePort
  selector:
    app: hotstar-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30785
