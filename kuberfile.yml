apiVersion: apps/v1
kind: Deployment
metadata:
  name: bingo-app
spec:
  replicas: 2
  strategy: 
    type: Recreate
  selector:
    matchLabels:
      name: bingo
  template:
    metadata:
      labels:
        name: bingo
    spec:
      containers:
        - name: app-tiger
          image: armcool004/bingo:revision
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: bingo-svc
spec:
  selector:
    name: bingo
  type: LoadBalancer
  ports:
    - port: 3000
      targetPort: 3000
    
